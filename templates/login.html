<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260430e') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            green: '#059669',
                            bg: '#F8FAFC'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
                        'glow': '0 10px 25px -5px rgba(5, 150, 105, 0.4)',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="guest-view text-slate-800 antialiased min-h-screen overflow-x-hidden pb-10 flex items-center justify-center">
        <main class="relative z-10 px-6 w-full max-w-md">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back
            </a>

            <section class="ultra-glass rounded-[2rem] p-8 flex flex-col gap-6">
                <div class="relative z-10 flex flex-col items-center text-center gap-3">
                    <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 shadow-inner">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    </div>
                    <h2 class="text-2xl font-extrabold text-slate-900">Admin Login</h2>
                    <p class="text-slate-500 text-sm">Sign in to manage attendance records</p>
                </div>

                {% if error %}
                <div class="relative z-10 bg-red-50 text-red-600 text-sm font-semibold px-4 py-3 rounded-xl border border-red-100">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="relative z-10 flex flex-col gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-slate-700">Username</label>
                        <input type="text" name="username" placeholder="admin" required
                            class="w-full px-4 py-3 rounded-xl bg-white/70 border border-white/60 text-slate-800 font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-slate-700">Password</label>
                        <input type="password" name="password" placeholder="Enter password" required
                            class="w-full px-4 py-3 rounded-xl bg-white/70 border border-white/60 text-slate-800 font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-full py-3.5 px-6 font-bold text-base shadow-glow flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 mt-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        Sign In
                    </button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
